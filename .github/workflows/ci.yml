name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: fail if the live API contract changed since the last regeneration.
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:contract
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contract-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/generate.mjs --fetch
      - run: git diff --exit-code openapi/ src/schema.ts
